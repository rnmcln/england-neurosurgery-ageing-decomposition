name: reproduce

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned environment
        run: python -m pip install -r requirements.txt
      - name: Download pinned sources, rebuild and verify
        env:
          NEUROSURG_PYTHON: python
        run: ./run_all.sh
      - name: Check that numerical outputs are unchanged
        run: git diff --exit-code -- derived outputs/tables outputs/publication/*.csv RESULTS.md
